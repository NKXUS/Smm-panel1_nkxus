<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f6fb;
            color: #111827;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(420px, calc(100vw - 32px));
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            line-height: 1.2;
        }

        p {
            margin: 0 0 22px;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 0 0 8px;
            color: #374151;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 44px;
            margin: 0 0 16px;
            padding: 0 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font: inherit;
        }

        input:focus {
            border-color: #2563eb;
            outline: 3px solid rgba(37, 99, 235, 0.16);
        }

        button {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .message {
            display: none;
            margin: 16px 0 0;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #065f46;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <main>
        <h1>Reset Password</h1>
        <p>Enter a new password for your account.</p>

        <form id="resetForm">
            <label for="password">New password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>

            <label for="password_confirmation">Confirm password</label>
            <input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="6" required>

            <button type="submit">Update Password</button>
            <div id="message" class="message" role="status"></div>
        </form>
    </main>

    <script>
        const form = document.getElementById('resetForm');
        const message = document.getElementById('message');
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const email = params.get('email');

        function showMessage(type, text) {
            message.className = `message ${type}`;
            message.textContent = text;
        }

        if (!token || !email) {
            form.querySelector('button').disabled = true;
            showMessage('error', 'This reset link is missing required information.');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const button = form.querySelector('button');
            const password = form.password.value;
            const passwordConfirmation = form.password_confirmation.value;

            if (password !== passwordConfirmation) {
                showMessage('error', 'Passwords do not match.');
                return;
            }

            button.disabled = true;
            showMessage('success', 'Updating your password...');

            try {
                const response = await fetch('/api/reset_password', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        token,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.status) {
                    throw new Error(data.message || 'Unable to reset password.');
                }

                showMessage('success', 'Password reset successfully. You can sign in now.');
                form.reset();
            } catch (error) {
                showMessage('error', error.message);
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
