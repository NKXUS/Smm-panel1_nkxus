<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | SMM Panel</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --primary: #4a7c59; /* Brand Sage */
            --primary-light: #52906b;
            --primary-dark: #3a5a40;
            --primary-glow: rgba(74, 124, 89, 0.12);
            --accent: #d4a373; /* Brand Gold */
            --secondary: #1a1c1e;
            --secondary-light: #6c757d;
            --white: #ffffff;
            --bg: #f8f9fa;
            --border: rgba(0, 0, 0, 0.05);
            --sidebar-width: 280px;
            --header-height: 80px;
            --radius-xl: 32px;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.08);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(74, 124, 89, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(212, 163, 115, 0.03) 0px, transparent 50%);
            color: var(--secondary);
            overflow-x: hidden;
            width: 100%;
            position: relative;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* -- SIDEBAR -- */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 1000;
            transition: var(--transition);
        }

        .sidebar-header {
            padding: 40px 32px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 12px;
            display: grid;
            place-items: center;
        }

        .logo-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--secondary);
            letter-spacing: 0.02em;
        }

        .sidebar-nav {
            flex: 1;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            text-decoration: none;
            color: var(--secondary-light);
            font-size: 14px;
            font-weight: 500;
            border-radius: var(--radius-md);
            transition: var(--transition);
        }

        .nav-item:hover,
        .nav-item.active {
            color: var(--white);
            background: var(--primary);
            box-shadow: 0 8px 24px var(--primary-glow);
        }

        .nav-item.active {
            color: var(--white);
            background: var(--primary);
            box-shadow: 0 8px 24px var(--primary-glow);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            stroke-width: 1.5px;
            transition: var(--transition);
        }

        .sidebar-footer {
            padding: 30px 20px;
            border-top: 1px solid var(--border);
        }

        /* -- MAIN -- */
        .main {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
        }

        /* -- TOP BAR -- */
        .top-bar {
            height: var(--header-height);
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 900;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--secondary);
            letter-spacing: -0.03em;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .balance-card {
            background: var(--white);
            padding: 10px 24px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            white-space: nowrap;
        }

        .balance-card:hover {
            border-color: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .balance-card span {
            color: var(--primary);
            font-weight: 700;
        }

        .search-box {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 300px;
            transition: var(--transition);
        }

        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .search-box input {
            background: none;
            border: none;
            color: var(--secondary);
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--white);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--secondary-light);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .icon-btn:hover {
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .notification {
            width: 44px;
            height: 44px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
            display: grid;
            place-items: center;
            color: var(--secondary-light);
            position: relative;
            transition: var(--transition);
        }

        .notification:hover {
            color: var(--primary);
            border-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .notification-dot {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 8px;
            height: 8px;
            background: #ff5e5e;
            border-radius: 50%;
            border: 2px solid var(--white);
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 18px;
            background: var(--primary);
            display: grid;
            place-items: center;
            box-shadow: 0 8px 16px var(--primary-glow);
            transition: var(--transition);
        }

        .avatar:hover {
            transform: translateY(-2px) rotate(5deg);
        }

        .badge-dot {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 8px;
            height: 8px;
            background: #ff4757;
            border-radius: 50%;
            border: 2px solid var(--white);
        }

        /* -- CONTENT -- */
        .content {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .admin-welcome-content {
            min-height: calc(100vh - var(--header-height) - 80px);
            display: grid;
            place-items: center;
        }

        .admin-welcome-message {
            color: var(--primary);
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(30px, 5vw, 52px);
            font-weight: 600;
            text-align: center;
        }

        /* -- STATS -- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 80px;
            background: var(--primary-glow);
            border-radius: 0 0 0 100%;
            opacity: 0.4;
        }

        .stat-head {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-glow);
            border-radius: 14px;
            display: grid;
            place-items: center;
            color: var(--primary);
        }

        .stat-trend {
            font-size: 12px;
            font-weight: 700;
            color: #27ae60;
            padding: 4px 10px;
            background: rgba(39, 174, 96, 0.1);
            border-radius: 8px;
            height: fit-content;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--secondary-light);
            font-weight: 500;
        }

        /* -- MAIN GRID -- */
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 32px;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 32px;
            box-shadow: var(--shadow-sm);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--secondary);
        }

        /* -- TABLE -- */
        .table-wrap {
            overflow-x: auto;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th {
            text-align: left;
            padding: 16px;
            font-size: 13px;
            color: var(--secondary-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }

        .table td {
            padding: 20px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-pic {
            width: 36px;
            height: 36px;
            background: var(--bg);
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 13px;
            color: var(--primary);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-success { background: #e3f9eb; color: #27ae60; }
        .status-warning { background: #fff4e5; color: #ff9f43; }
/* -- ACTIVITY -- */
        .activity-item {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            position: relative;
        }

        .activity-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 18px;
            top: 44px;
            width: 1px;
            height: calc(100% - 20px);
            background: var(--border);
        }

        .activity-icon {
            width: 38px;
            height: 38px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: var(--primary);
            z-index: 1;
        }

        .activity-text {
            font-size: 14px;
            margin-bottom: 4px;
            line-height: 1.5;
        }

        .activity-time {
            font-size: 12px;
            color: var(--secondary-light);
        }

        /* -- MOBILE -- */
        .mobile-toggle {
            display: none;
            width: 44px;
            height: 44px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 14px;
            place-items: center;
            cursor: pointer;
        }

        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .main-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 1100px) {
            .sidebar { transform: translateX(-100%); width: 300px; }
            .sidebar.active { transform: translateX(0); }
            .main { margin-left: 0; }
            .mobile-toggle { display: grid; }
        }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr; }
            .content { padding: 24px 16px; }
            .top-bar { padding: 0 16px; }
            .search-box { display: none; }
            .page-title { display: none; }
            .top-actions { gap: 10px; }
            .balance-card {
                padding: 8px 12px;
                font-size: 12px;
                gap: 6px;
            }
        }
    </style>
</head>

    <script>
        const mobileToggle = document.getElementById('mobile-toggle');
        const sidebar = document.getElementById('sidebar');

        mobileToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 1100) {
                if (!sidebar.contains(e.target) && !mobileToggle.contains(e.target)) {
                    sidebar.classList.remove('active');
                }
            }
        });
    </script>
