<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Widget | SMM Panel</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #4a7c59;
            --primary-light: #52906b;
            --primary-dark: #3a5a40;
            --primary-glow: rgba(74, 124, 89, 0.15);
            --secondary: #1a1c1e;
            --secondary-light: #6c757d;
            --accent: #d4a373;
            --white: #ffffff;
            --bg: #f8f9fa;
            --glass: rgba(255, 255, 255, 0.8);
            --border: rgba(0, 0, 0, 0.05);
            --sidebar-width: 280px;
            --header-height: 80px;
            --radius-xl: 32px;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.08);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(74, 124, 89, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(212, 163, 115, 0.03) 0px, transparent 50%);
            color: var(--secondary);
            overflow-x: hidden;
            width: 100%;
            position: relative;
            letter-spacing: -0.01em;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 1000;
            transition: var(--transition);
        }

        .sidebar-header {
            padding: 40px 32px;
            display: flex;
            align-items: center;
        }

        .sidebar-nav {
            flex: 1;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            text-decoration: none;
            color: var(--secondary-light);
            font-size: 14px;
            font-weight: 500;
            border-radius: var(--radius-md);
            transition: var(--transition);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            stroke-width: 1.5px;
            transition: var(--transition);
        }

        .nav-item:hover {
            background: var(--white);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
            transform: translateX(4px);
        }

        .nav-item.active {
            background: var(--primary);
            color: var(--white);
            box-shadow: 0 12px 24px var(--primary-glow);
        }

        .nav-item.active svg {
            transform: scale(1.1);
        }

        .sidebar-footer {
            padding: 32px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ── MAIN CONTENT ── */
        .main {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            height: var(--header-height);
            background: rgba(248, 249, 250, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 48px;
            position: sticky;
            top: 0;
            z-index: 900;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--secondary);
            letter-spacing: -0.03em;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .balance-card {
            background: var(--white);
            padding: 10px 24px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            cursor: pointer;
        }

        .balance-card span {
            color: var(--primary);
            font-weight: 700;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--primary);
            display: grid;
            place-items: center;
            box-shadow: 0 8px 16px var(--primary-glow);
            transition: var(--transition);
            cursor: pointer;
        }

        .content {
            padding: 48px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .updates-header-box {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            margin-bottom: 40px;
            box-shadow: var(--shadow-md);
        }

        .filters-bar {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .filter-select {
            height: 52px;
            padding: 0 24px;
            background: #f1f3f5;
            border: 1px solid transparent;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            color: var(--secondary);
            outline: none;
            cursor: pointer;
            min-width: 180px;
            transition: var(--transition);
        }

        .filter-select:focus {
            background: var(--white);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .search-wrap {
            position: relative;
            flex: 1;
        }

        .search-input {
            width: 100%;
            height: 52px;
            padding: 0 24px 0 54px;
            background: #f1f3f5;
            border: 1px solid transparent;
            border-radius: 14px;
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        .search-input:focus {
            background: var(--white);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .search-wrap svg {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-light);
            pointer-events: none;
        }

        .table-container {
            background: var(--white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
        }

        .updates-table {
            width: 100%;
            border-collapse: collapse;
        }

        .updates-table th {
            padding: 20px 24px;
            background: #f8f9fa;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--secondary-light);
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .updates-table td {
            padding: 20px 24px;
            font-size: 14px;
            color: var(--secondary);
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .service-cell {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .service-id {
            background: var(--primary-glow);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .service-name {
            font-weight: 600;
            line-height: 1.5;
            color: var(--secondary);
        }

        .date-cell {
            white-space: nowrap;
            color: var(--secondary-light);
            font-weight: 600;
            font-size: 13px;
        }

        .update-description {
            font-weight: 700;
            font-size: 13px;
        }

        .update-increase {
            color: #e63946;
        }

        .update-decrease {
            color: #2a9d8f;
        }

        .update-enabled {
            color: var(--primary);
        }

        .updates-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 28px 0 8px;
            flex-wrap: wrap;
        }

        .updates-pagination .pagination-btn {
            min-width: 42px;
            height: 42px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--white);
            color: var(--secondary);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .updates-pagination .pagination-btn:hover:not(:disabled),
        .updates-pagination .pagination-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--white);
            box-shadow: 0 10px 22px var(--primary-glow);
        }

        .updates-pagination .pagination-btn:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        .updates-pagination .pagination-ellipsis {
            min-width: 28px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--secondary-light);
            font-weight: 800;
        }

        .updates-pagination .pagination-summary {
            width: 100%;
            text-align: center;
            color: var(--secondary-light);
            font-size: 13px;
            font-weight: 500;
            margin-top: 4px;
        }

        .widget-form-card {
            margin-top: 28px;
            background: var(--white);
            border-radius: 18px;
            padding: 28px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .widget-form-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 22px;
        }

        .widget-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 800;
            color: var(--secondary);
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 18px;
            background: #f1f3f5;
            border: 1px solid transparent;
            border-radius: 14px;
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus {
            background: var(--white);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .widget-toggle {
            height: 52px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 700;
            color: var(--secondary);
            user-select: none;
        }

        .widget-toggle input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .btn-save-widget {
            grid-column: 1 / -1;
            justify-self: center;
            height: 52px;
            border: none;
            border-radius: 14px;
            background: var(--primary);
            color: var(--white);
            padding: 0 24px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 22px var(--primary-glow);
            transition: var(--transition);
        }

        .btn-save-widget:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .widget-alert {
            display: none;
            margin-top: 18px;
            padding: 14px 18px;
            border-radius: 14px;
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            color: #2e7d32;
            font-size: 14px;
            font-weight: 700;
        }

        .widget-alert.error {
            background: #fff5f5;
            border-color: #ffd6d6;
            color: #c92a2a;
        }

        .widget-table-card {
            margin-top: 28px;
        }

        .widget-message-cell {
            max-width: 420px;
            line-height: 1.5;
            font-weight: 600;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status-badge.active {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-badge.inactive {
            background: #fff5f5;
            color: #c92a2a;
        }

        @media (max-width: 1100px) {
            .sidebar {
                transform: translateX(-100%);
                width: 300px;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            .top-bar {
                padding: 0 24px;
            }

            .mobile-menu-btn {
                display: flex;
                width: 44px;
                height: 44px;
                background: var(--white);
                border: 1px solid var(--border);
                border-radius: 14px;
                align-items: center;
                justify-content: center;
                cursor: pointer;
            }
        }

        /* ── WHATSAPP FLOAT ── */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
            z-index: 950;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .whatsapp-float {
                width: 50px;
                height: 50px;
                bottom: 20px;
                right: 20px;
            }

            .whatsapp-float svg {
                width: 28px;
                height: 28px;
            }
        }

        .whatsapp-float:hover {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 15px 35px rgba(37, 211, 102, 0.5);
            color: white;
        }

        .whatsapp-float svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        @media (max-width: 800px) {
            .filters-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-select {
                min-width: 100%;
            }

            .widget-form {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .top-bar {
                height: 74px;
                padding: 0 16px;
            }

            .page-title {
                display: none;
            }

            .content {
                padding: 24px 16px 100px;
            }

            .updates-header-box {
                padding: 16px;
                margin-bottom: 32px;
                border-radius: 20px;
            }

            .balance-card {
                padding: 8px 14px;
                font-size: 12px;
                border-radius: 12px;
            }

            .balance-card span {
                font-size: 13px;
            }

            .notification,
            .avatar {
                width: 40px;
                height: 40px;
                border-radius: 12px;
            }

            /* Table to Card Transformation */
            .updates-table thead {
                display: none;
            }

            .updates-table,
            .updates-table tbody,
            .updates-table tr,
            .updates-table td {
                display: block;
                width: 100%;
            }

            .updates-table {
                background: transparent;
                border: none;
            }

            .table-container {
                background: transparent;
                border: none;
                box-shadow: none;
                overflow: visible;
            }

            .updates-table tr {
                background: var(--white);
                border-radius: 24px;
                padding: 24px;
                margin-bottom: 20px;
                box-shadow: var(--shadow-md);
                border: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                position: relative;
                overflow: hidden;
            }

            .updates-table td {
                padding: 0 !important;
                border: none !important;
                margin-bottom: 16px;
            }

            .updates-table td:last-child {
                margin-bottom: 0;
            }

            /* Date Tag */
            .updates-table td[data-label="Date"] {
                order: 1;
                margin-bottom: 12px;
            }

            .date-cell {
                display: inline-block;
                background: #f1f3f5;
                color: var(--secondary-light);
                font-size: 11px;
                font-weight: 700;
                padding: 4px 12px;
                border-radius: 8px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            /* Service Name */
            .updates-table td[data-label="Service"] {
                order: 2;
                margin-bottom: 20px;
            }

            .service-cell {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .service-id {
                color: var(--primary);
                font-family: monospace;
                font-size: 12px;
                font-weight: 700;
            }

            .service-id::before {
                content: 'ID: ';
            }

            .service-name {
                font-size: 16px;
                font-weight: 700;
                color: var(--secondary);
                line-height: 1.4;
                margin: 0;
            }

            /* Update Description */
            .updates-table td[data-label="Update"] {
                order: 3;
                background: #f8fafc;
                margin: 0 -24px -24px;
                padding: 20px 24px !important;
                border-top: 1px solid var(--border) !important;
            }

            .update-description {
                font-size: 14px;
                font-weight: 600;
                line-height: 1.5;
            }

            .update-increase {
                color: #d63031;
            }

            .update-decrease {
                color: #27ae60;
            }

        }
    </style>
</head>

    <script>
        const mobileToggle = document.getElementById('mobile-toggle');
        const sidebar = document.getElementById('sidebar');

        mobileToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 1100) {
                if (!sidebar.contains(e.target) && !mobileToggle.contains(e.target)) {
                    sidebar.classList.remove('active');
                }
            }
        });
    </script>
    <script>
        (() => {
            function getCurrentUser() {
                const rawUser = localStorage.getItem('smm_user') || sessionStorage.getItem('smm_user');
                try {
                    return JSON.parse(rawUser || '{}') || {};
                } catch (_error) {
                    return {};
                }
            }

            if (String(getCurrentUser().role || 'client').toLowerCase() !== 'admin') {
                window.location.replace('dashboard.html');
                return;
            }

            const API_BASE_URL = window.SMM_API_BASE_URL || 'http://127.0.0.1:8000';
            const widgetForm = document.getElementById('whatsapp-widget-form');
            const widgetPhone = document.getElementById('widget-phone');
            const widgetMessage = document.getElementById('widget-message');
            const widgetActive = document.getElementById('widget-active');
            const widgetAlert = document.getElementById('widget-alert');
            const saveWidgetButton = document.getElementById('btn-save-widget');
            const widgetsTableBody = document.getElementById('widgets-table-body');
            const widgetsPagination = document.getElementById('widgets-pagination');
            const rowsPerPage = 10;
            let widgets = [];
            let currentPage = 1;

            function showWidgetAlert(message, isError = false) {
                widgetAlert.textContent = message;
                widgetAlert.classList.toggle('error', isError);
                widgetAlert.style.display = 'block';
            }

            function escapeHtml(value) {
                return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[char]));
            }

            function formatDate(value) {
                const date = new Date(value || Date.now());
                if (Number.isNaN(date.getTime())) return '-';
                return date.toISOString().slice(0, 10);
            }

            function normalizePhone(value) {
                return value.replace(/\D/g, '');
            }

            async function widgetRequest(path, options = {}) {
                const response = await fetch(`${API_BASE_URL}${path}`, {
                    headers: {
                        Accept: 'application/json',
                        'Content-Type': 'application/json'
                    },
                    ...options
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.status === false) {
                    throw new Error(data.error || data.message || 'Could not save WhatsApp widget.');
                }
                return data;
            }

            function itemsFromPayload(payload) {
                return payload?.data?.data || payload?.data || [];
            }

            async function loadAllWidgets() {
                const firstPayload = await widgetRequest('/api/getwhatsappwidgets');
                const firstItems = itemsFromPayload(firstPayload);
                const lastPage = Number(firstPayload.data?.last_page || 1);
                const requests = [];

                for (let page = 2; page <= lastPage; page += 1) {
                    requests.push(widgetRequest(`/api/getwhatsappwidgets?page=${page}`));
                }

                const results = await Promise.allSettled(requests);
                const restItems = results.flatMap((result) => (
                    result.status === 'fulfilled' ? itemsFromPayload(result.value) : []
                ));

                widgets = [...firstItems, ...restItems].sort((a, b) => Number(a.id || 0) - Number(b.id || 0));
                renderWidgets();
            }

            function renderPagination(totalItems, page) {
                const lastPage = Math.max(1, Math.ceil(totalItems / rowsPerPage));
                const safePage = Math.min(Math.max(1, page), lastPage);
                const from = totalItems ? ((safePage - 1) * rowsPerPage) + 1 : 0;
                const to = Math.min(safePage * rowsPerPage, totalItems);

                if (totalItems <= rowsPerPage) {
                    widgetsPagination.innerHTML = totalItems
                        ? `<div class="pagination-summary">Showing ${from}-${to} of ${totalItems} widgets</div>`
                        : '';
                    return;
                }

                function pageRange() {
                    const pages = new Set([1, lastPage, safePage - 1, safePage, safePage + 1]);
                    return Array.from(pages)
                        .filter((pageNumber) => pageNumber >= 1 && pageNumber <= lastPage)
                        .sort((a, b) => a - b);
                }

                const pages = pageRange();
                let previousPage = 0;
                const pageButtons = pages.map((pageNumber) => {
                    const ellipsis = pageNumber - previousPage > 1
                        ? '<span class="pagination-ellipsis">...</span>'
                        : '';
                    previousPage = pageNumber;
                    return `
                        ${ellipsis}
                        <button class="pagination-btn ${pageNumber === safePage ? 'active' : ''}" type="button" data-page="${pageNumber}">${pageNumber}</button>
                    `;
                }).join('');

                widgetsPagination.innerHTML = `
                    <button class="pagination-btn" type="button" data-page="${safePage - 1}" ${safePage <= 1 ? 'disabled' : ''}>Previous</button>
                    ${pageButtons}
                    <button class="pagination-btn" type="button" data-page="${safePage + 1}" ${safePage >= lastPage ? 'disabled' : ''}>Next</button>
                    <div class="pagination-summary">Showing ${from}-${to} of ${totalItems} widgets</div>
                `;

                widgetsPagination.querySelectorAll('.pagination-btn').forEach((button) => {
                    button.addEventListener('click', () => {
                        const nextPage = Number(button.dataset.page);
                        if (!nextPage || nextPage === currentPage) return;
                        currentPage = nextPage;
                        renderWidgets();
                    });
                });
            }

            function renderWidgets() {
                const lastPage = Math.max(1, Math.ceil(widgets.length / rowsPerPage));
                currentPage = Math.min(Math.max(1, currentPage), lastPage);
                const start = (currentPage - 1) * rowsPerPage;
                const pageItems = widgets.slice(start, start + rowsPerPage);

                if (!pageItems.length) {
                    widgetsTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:48px;">No WhatsApp widgets found.</td></tr>';
                    widgetsPagination.innerHTML = '';
                    return;
                }

                widgetsTableBody.innerHTML = pageItems.map((widget) => {
                    const isActive = !(String(widget.is_active) === '0' || widget.is_active === false);
                    return `
                        <tr>
                            <td data-label="ID"><span class="service-id">${escapeHtml(widget.id || '-')}</span></td>
                            <td data-label="Phone Number">${escapeHtml(widget.phone_number || '-')}</td>
                            <td data-label="Greeting Message" class="widget-message-cell">${escapeHtml(widget.greeting_message || '-')}</td>
                            <td data-label="Status"><span class="status-badge ${isActive ? 'active' : 'inactive'}">${isActive ? 'Active' : 'Inactive'}</span></td>
                            <td data-label="Created Date" class="date-cell">${escapeHtml(formatDate(widget.created_at))}</td>
                        </tr>
                    `;
                }).join('');

                renderPagination(widgets.length, currentPage);
            }

            widgetForm.addEventListener('submit', async (event) => {
                event.preventDefault();

                const phone = normalizePhone(widgetPhone.value);
                const message = widgetMessage.value.trim();

                if (!phone) {
                    showWidgetAlert('Enter a valid WhatsApp phone number.', true);
                    return;
                }

                if (!message) {
                    showWidgetAlert('Enter greeting message.', true);
                    return;
                }

                saveWidgetButton.disabled = true;
                saveWidgetButton.textContent = 'Saving...';

                try {
                    const data = await widgetRequest('/api/createwhatsappwidget', {
                        method: 'POST',
                        body: JSON.stringify({
                            phone_number: phone,
                            greeting_message: message,
                            is_active: widgetActive.checked
                        })
                    });

                    showWidgetAlert(data.message || 'WhatsApp widget saved successfully.');
                    widgetForm.reset();
                    widgetActive.checked = true;
                    currentPage = 1;
                    await loadAllWidgets();
                } catch (error) {
                    showWidgetAlert(error.message, true);
                } finally {
                    saveWidgetButton.disabled = false;
                    saveWidgetButton.textContent = 'Submit';
                }
            });

            loadAllWidgets().catch((error) => {
                widgetsTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:48px;">${escapeHtml(error.message)}</td></tr>`;
                widgetsPagination.innerHTML = '';
            });
        })();
    </script>
    <script src="static/js/smm-api.js"></script>
    <script src="static/js/logout.js"></script>
    <script src="static/js/whatsapp-widget.js"></script>
